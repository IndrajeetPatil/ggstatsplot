name: prek

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Distinct from the called workflow's own group, which would otherwise
# deadlock with this one.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prek:
    uses: IndrajeetPatil/workflows/.github/workflows/prek.yml@main
